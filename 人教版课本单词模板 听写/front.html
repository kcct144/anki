<body class="bg-gray-50 p-4">
  <div class="max-w-7xl mx-auto">
    <!-- 单词卡片 -->
    <div
      class="bg-white bg-opacity-0 rounded-xl border border-gray-200 shadow-sm p-6 mb-6"
    >
      <div class="flex flex-col md:flex-row md:items-end md:justify-between">
        <div class="w-full">
          <h1 class="text-2xl font-bold text-gray-800 mb-6">听写练习</h1>

          <!-- 音频播放按钮、填空区域和检查按钮放在同一行 -->
          <div class="flex flex-col md:flex-row items-center gap-4 mb-6">
            <!-- 音频播放按钮 -->
            <div class="flex-shrink-0">
              <button
                onclick="playAudio()"
                class="flex items-center justify-center w-12 h-12 rounded-full bg-blue-500 hover:bg-blue-600 transition-all text-white text-xl"
              >
                播放 ▶
              </button>
            </div>

            <!-- 填空区域 -->
            <div class="flex-grow w-full">
              <input
                type="text"
                id="userAnswer"
                placeholder="在此输入听到的单词或短语"
                class="w-full px-4 py-3 text-xl border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                onkeyup="checkEnter(event)"
              />
            </div>

            <!-- 检查按钮 -->
            <div class="flex-shrink-0">
              <button
                onclick="checkAnswer()"
                class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-all font-medium whitespace-nowrap"
              >
                检查答案
              </button>
            </div>
          </div>

          <!-- 结果显示区域 -->
          <div
            id="result"
            class="mt-6 text-center text-xl font-medium min-h-8"
          ></div>
        </div>
      </div>
    </div>
  </div>

  <audio
    id="my-audio"
    autoplay
    src="https://dict.youdao.com/dictvoice?audio={{单词}}"
  ></audio>

  <link rel="stylesheet" href="css.css" />

  <script>
    document.getElementById("userAnswer").focus()
    function checkAnswer() {
      const userAnswer = document.getElementById("userAnswer").value.trim()
      const correctAnswer = "{{单词}}".trim().toLowerCase()
      const resultElement = document.getElementById("result")

      if (userAnswer.toLowerCase() === correctAnswer) {
        resultElement.innerHTML = '<span class="text-green-600">✅ 正确!</span>'
        resultElement.className =
          "mt-6 text-center text-xl font-medium min-h-8 text-green-600"
      } else {
        resultElement.innerHTML = `<span class="text-red-600">❌ 错误! 正确答案: {{单词}}</span>`
        resultElement.className =
          "mt-6 text-center text-xl font-medium min-h-8 text-red-600"
      }
      document.getElementById('userAnswer').readOnly = true;
    }

    function checkEnter(event) {
      if (event.key === "Enter") {
        checkAnswer()
      }
    }
  </script>
</body>
