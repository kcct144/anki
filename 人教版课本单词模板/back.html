<body class="bg-gray-50 p-4">
  <div class="max-w-7xl mx-auto">
    <!-- 单词卡片 -->
    <div
      class="bg-white bg-opacity-0 rounded-xl border border-gray-200 shadow-sm p-6 mb-6"
    >
      <div class="flex flex-col md:flex-row">
        <div>
          <div class="flex items-end">
            <h1 class="text-4xl font-bold text-gray-800">{{单词}}</h1>
            <div class="flex items-center ml-4">
              <span class="text-gray-600 font-mono">{{音标}}</span>
              <button
                onclick="document.getElementById('my-audio').play()"
                class="ml-3 flex items-center justify-center w-5 h-5 rounded-full bg-blue-500 hover:bg-blue-600 transition-all"
              >
                ▶
              </button>
            </div>
            {{#年级}}
            <span
              class="ml-3 mb-1 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-50 text-blue-600 border border-blue-100"
            >
              {{年级}}
            </span>
            {{/年级}} {{#学期}}
            <span
              class="ml-3 mb-1 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-50 text-blue-600 border border-blue-100"
            >
              {{学期}}
            </span>
            {{/学期}} {{#单元}}
            <span
              class="ml-3 mb-1 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-50 text-blue-600 border border-blue-100"
            >
              {{单元}}
            </span>
            {{/单元}}
          </div>
          <h2 class="text-xl text-gray-600 mt-2">{{课本释义}}</h2>
        </div>
      </div>
    </div>

    <!-- 内容区 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- 左栏 -->
      <div class="lg:col-span-2 space-y-6">
        <!-- 相关短语 -->
        {{#相关短语}}
        <div
          class="bg-white bg-opacity-0 rounded-xl border border-gray-200 shadow-sm overflow-hidden"
        >
          <div class="p-6">
            <div class="space-y-4">{{相关短语}}</div>
          </div>
        </div>
        {{/相关短语}}
        <!-- 教材原句 -->
        {{#教材原句}}
        <div
          class="bg-white bg-opacity-0 rounded-xl border border-gray-200 shadow-sm overflow-hidden"
        >
          <div class="p-6">
            <div class="space-y-4">{{教材原句}}</div>
          </div>
        </div>
        {{/教材原句}}
        <!-- 基本释义 -->
        {{#基本释义}}
        <div
          class="bg-white bg-opacity-0 rounded-xl border border-gray-200 shadow-sm overflow-hidden"
        >
          <div class="p-6">
            <div class="space-y-4">{{基本释义}}</div>
          </div>
        </div>
        {{/基本释义}}
        <!-- 例句卡片 -->
        {{#词典例句}}
        <div
          class="bg-white bg-opacity-0 rounded-xl border border-gray-200 shadow-sm overflow-hidden"
        >
          <div class="p-6">
            <div class="space-y-4">
              <div class="pl-4">{{词典例句}}</div>
            </div>
          </div>
        </div>
        {{/词典例句}}
        <!-- 笔记卡片 -->
        {{#笔记}}
        <div
          class="bg-white bg-opacity-0 rounded-xl border border-gray-200 shadow-sm overflow-hidden"
        >
          <div class="p-6">
            <div class="prose prose-sm max-w-none text-gray-800">{{笔记}}</div>
          </div>
        </div>
        {{/笔记}}
        <!-- 图片展示 -->
        <div
          class="bg-white bg-opacity-0 rounded-xl border border-gray-200 shadow-sm overflow-hidden"
        >
          <div class="p-6">
            <div class="flex justify-center">
              <iframe
                src="https://www.bing.com/images/async?q={{单词}}&first=10&count=10&mmasync=1"
                width="100%"
                height="400"
                frameborder="0"
                style="pointer-events: none; height: 800px"
              >
              </iframe>
            </div>
          </div>
        </div>
      </div>

      <!-- 右栏 -->
      <div class="space-y-6">
        <!-- 同根词卡片 -->
        {{#同根词}}
        <div
          class="bg-white bg-opacity-0 rounded-xl border border-gray-200 shadow-sm overflow-hidden"
        >
          <div class="p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">同根词</h3>
            <div class="prose prose-sm max-w-none text-gray-800">
              {{同根词}}
            </div>
          </div>
        </div>
        {{/同根词}}

        <!-- 近义词卡片 -->
        {{#近义词}}
        <div
          class="bg-white bg-opacity-0 rounded-xl border border-gray-200 shadow-sm overflow-hidden"
        >
          <div class="p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">近义词</h3>
            <div class="prose prose-sm max-w-none text-gray-800">
              {{近义词}}
            </div>
          </div>
        </div>
        {{/近义词}}
      </div>
    </div>
  </div>
  <audio
    id="my-audio"
    autoplay
    src="https://dict.youdao.com/dictvoice?audio={{单词}}"
  ></audio>
  <link rel="stylesheet" href="css.css" />
</body>
